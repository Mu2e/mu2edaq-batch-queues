---
# Local accounts with identical UID/GID on every node. Runs before any package
# install so the munge and slurm RPM scriptlets find the accounts already
# present and do not allocate dynamic IDs.

- name: Read the passwd database
  ansible.builtin.getent:
    database: passwd

- name: Service-account groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    system: true
  loop: "{{ mc1_service_accounts }}"
  loop_control:
    label: "{{ item.name }}:{{ item.gid }}"

- name: Service accounts (no login)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    home: "{{ item.home }}"
    create_home: false
    shell: /sbin/nologin
    system: true
    comment: "{{ item.comment }}"
  loop: "{{ mc1_service_accounts }}"
  loop_control:
    label: "{{ item.name }}:{{ item.uid }}"

- name: New job accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.group }}"
    home: "{{ item.home }}"
    create_home: true
    shell: /bin/bash
    password_lock: true
    comment: "{{ item.comment }}"
  loop: "{{ mc1_job_accounts | selectattr('create') | list }}"
  loop_control:
    label: "{{ item.name }}:{{ item.uid }}"

- name: Kerberos principals allowed to log in as new job accounts
  ansible.builtin.copy:
    dest: "{{ item.home }}/.k5login"
    content: "{{ item.k5login | join('\n') }}\n"
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "0644"
  loop: "{{ mc1_job_accounts | selectattr('create') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.k5login | default([]) | length > 0
  ignore_errors: "{{ ansible_check_mode }}"   # home does not exist yet in a first --check

- name: Repair ownership of existing job-account home directories
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[item.name][4] }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ ansible_facts.getent_passwd[item.name][2] }}"
  loop: "{{ mc1_job_accounts | rejectattr('create') | selectattr('fix_home_ownership', 'defined') | selectattr('fix_home_ownership') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in ansible_facts.getent_passwd
