---
# Local accounts with identical UID/GID on every node. Runs before any package
# install so the munge and slurm RPM scriptlets find the accounts already
# present and do not allocate dynamic IDs.

- name: Look up existing job accounts and k5login sources (keyed; includes SSSD)
  ansible.builtin.command: getent passwd {{ item }}
  loop: >-
    {{ (mc1_job_accounts | rejectattr('create') | map(attribute='name') | list
       + mc1_job_accounts | selectattr('create') | map(attribute='k5login_from', default=[]) | flatten) | unique }}
  register: acct_pw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Index them (name -> passwd fields)
  ansible.builtin.set_fact:
    acct_passwd: >-
      {{ dict(acct_pw.results | selectattr('rc', 'equalto', 0) | map(attribute='item')
         | zip(acct_pw.results | selectattr('rc', 'equalto', 0) | map(attribute='stdout') | map('split', ':'))) }}

- name: Service-account groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    system: true
  loop: "{{ mc1_service_accounts }}"
  loop_control:
    label: "{{ item.name }}:{{ item.gid }}"

- name: Service accounts (no login)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    home: "{{ item.home }}"
    create_home: false
    shell: /sbin/nologin
    system: true
    comment: "{{ item.comment }}"
  loop: "{{ mc1_service_accounts }}"
  loop_control:
    label: "{{ item.name }}:{{ item.uid }}"

- name: New job accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.group }}"
    home: "{{ item.home }}"
    create_home: true
    shell: /bin/bash
    password_lock: true
    comment: "{{ item.comment }}"
  loop: "{{ mc1_job_accounts | selectattr('create') | list }}"
  loop_control:
    label: "{{ item.name }}:{{ item.uid }}"

- name: Read the source accounts' .k5login files
  ansible.builtin.slurp:
    src: "{{ acct_passwd[item.1][4] }}/.k5login"
  loop: "{{ mc1_job_accounts | selectattr('create') | list | subelements('k5login_from', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} <- {{ item.1 }}"
  register: k5_src
  when: item.1 in acct_passwd
  failed_when: false

- name: .k5login for new job accounts (union of the sources plus k5login)
  ansible.builtin.template:
    src: k5login.j2
    dest: "{{ acct.home }}/.k5login"
    owner: "{{ acct.name }}"
    group: "{{ acct.group }}"
    mode: "0644"
  loop: "{{ mc1_job_accounts | selectattr('create') | list }}"
  loop_control:
    loop_var: acct
    label: "{{ acct.name }}"
  when: (acct.k5login_from | default([]) | length > 0) or (acct.k5login | default([]) | length > 0)
  ignore_errors: "{{ ansible_check_mode }}"   # home does not exist yet in a first --check

- name: Repair ownership of existing job-account home directories
  ansible.builtin.file:
    path: "{{ acct_passwd[item.name][4] }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ acct_passwd[item.name][2] }}"
  loop: "{{ mc1_job_accounts | rejectattr('create') | selectattr('fix_home_ownership', 'defined') | selectattr('fix_home_ownership') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in acct_passwd
