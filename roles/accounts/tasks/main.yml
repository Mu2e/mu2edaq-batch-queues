---
# Local accounts with identical UID/GID on every node. Runs before any package
# install so the munge and slurm RPM scriptlets find the accounts already
# present and do not allocate dynamic IDs.

- name: Look up existing job accounts and k5login sources (keyed; includes SSSD)
  ansible.builtin.command: getent passwd {{ item }}
  loop: >-
    {{ (mc1_job_accounts | rejectattr('create') | map(attribute='name') | list
       + mc1_job_accounts | selectattr('create') | map(attribute='k5login_from', default=[]) | flatten
       + mc1_job_accounts | selectattr('create') | selectattr('login_env_from', 'defined') | map(attribute='login_env_from') | list) | unique }}
  register: acct_pw
  changed_when: false
  failed_when: false
  check_mode: false

# passwd fields: 0 name, 1 pw, 2 uid, 3 gid, 4 gecos, 5 home, 6 shell
- name: Index them (name -> passwd fields)
  ansible.builtin.set_fact:
    acct_passwd: >-
      {{ dict(acct_pw.results | selectattr('rc', 'equalto', 0) | map(attribute='item')
         | zip(acct_pw.results | selectattr('rc', 'equalto', 0) | map(attribute='stdout') | map('split', ':'))) }}

- name: Service-account groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    system: true
  loop: "{{ mc1_service_accounts }}"
  loop_control:
    label: "{{ item.name }}:{{ item.gid }}"

- name: Service accounts (no login)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    home: "{{ item.home }}"
    create_home: false
    shell: /sbin/nologin
    system: true
    comment: "{{ item.comment }}"
  loop: "{{ mc1_service_accounts }}"
  loop_control:
    label: "{{ item.name }}:{{ item.uid }}"

- name: New job accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.group }}"
    home: "{{ item.home }}"
    create_home: true
    shell: /bin/bash
    password_lock: true
    comment: "{{ item.comment }}"
  loop: "{{ mc1_job_accounts | selectattr('create') | list }}"
  loop_control:
    label: "{{ item.name }}:{{ item.uid }}"

- name: Home directory mode of new job accounts (750, as mu2eshift/mu2edaq)
  ansible.builtin.file:
    path: "{{ item.home }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "0750"
  loop: "{{ mc1_job_accounts | selectattr('create') | list }}"
  loop_control:
    label: "{{ item.home }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Read the source accounts' .k5login files
  ansible.builtin.slurp:
    src: "{{ acct_passwd[item.1][5] }}/.k5login"
  loop: "{{ mc1_job_accounts | selectattr('create') | list | subelements('k5login_from', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} <- {{ item.1 }}"
  register: k5_src
  when: item.1 in acct_passwd and acct_passwd[item.1][5] is match('^/')
  failed_when: false

- name: .k5login for new job accounts (union of the sources plus k5login)
  ansible.builtin.template:
    src: k5login.j2
    dest: "{{ acct.home }}/.k5login"
    owner: "{{ acct.name }}"
    group: "{{ acct.group }}"
    mode: "0600"                 # as mu2eshift's
  loop: "{{ mc1_job_accounts | selectattr('create') | list }}"
  loop_control:
    loop_var: acct
    label: "{{ acct.name }}"
  when: (acct.k5login_from | default([]) | length > 0) or (acct.k5login | default([]) | length > 0)
  ignore_errors: "{{ ansible_check_mode }}"   # home does not exist yet in a first --check

# ---- login environment, the same way the other mu2e accounts have it ----

- name: Copy the reference account's daq-shifter-tools checkout (same commit)
  ansible.builtin.shell: |
    set -euo pipefail
    cp -a {{ src_home }}/daq-shifter-tools {{ acct.home }}/daq-shifter-tools
    chown -R {{ acct.name }}:{{ acct.group }} {{ acct.home }}/daq-shifter-tools
  args:
    creates: "{{ acct.home }}/daq-shifter-tools/install-login.sh"
    executable: /bin/bash
  vars:
    src_home: "{{ acct_passwd[acct.login_env_from][5] }}"
  loop: "{{ mc1_job_accounts | selectattr('create') | selectattr('login_env_from', 'defined') | list }}"
  loop_control:
    loop_var: acct
    label: "{{ acct.name }} <- {{ acct.login_env_from }}"
  when: acct_passwd[acct.login_env_from][5] is match('^/')

- name: Run install-login.sh as the account (dotfiles, ~/bin, ~/.mu2edaq/env)
  ansible.builtin.command: >-
    runuser -u {{ acct.name }} -- env HOME={{ acct.home }}
    {{ acct.home }}/daq-shifter-tools/install-login.sh -d {{ acct.home }}
  args:
    creates: "{{ acct.home }}/.mu2edaq/env"
  loop: "{{ mc1_job_accounts | selectattr('create') | selectattr('login_env_from', 'defined') | list }}"
  loop_control:
    loop_var: acct
    label: "{{ acct.name }}"

- name: ~/.ssh for accounts that copy files into it
  ansible.builtin.file:
    path: "{{ acct.home }}/.ssh"
    state: directory
    owner: "{{ acct.name }}"
    group: "{{ acct.group }}"
    mode: "0700"
  loop: "{{ mc1_job_accounts | selectattr('create') | selectattr('login_files_copy', 'defined') | list }}"
  loop_control:
    loop_var: acct
    label: "{{ acct.name }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Copy the remaining login files from the reference account
  ansible.builtin.copy:
    src: "{{ acct_passwd[item.0.login_env_from][5] }}/{{ item.1 }}"
    dest: "{{ item.0.home }}/{{ item.1 }}"
    remote_src: true
    owner: "{{ item.0.name }}"
    group: "{{ item.0.group }}"
    mode: preserve
  loop: "{{ mc1_job_accounts | selectattr('create') | selectattr('login_files_copy', 'defined') | list | subelements('login_files_copy') }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Repair ownership of existing job-account home directories
  ansible.builtin.file:
    path: "{{ acct_passwd[item.name][5] }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ acct_passwd[item.name][3] }}"
  loop: "{{ mc1_job_accounts | rejectattr('create') | selectattr('fix_home_ownership', 'defined') | selectattr('fix_home_ownership') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in acct_passwd and acct_passwd[item.name][5] is match('^/')   # never a relative path
