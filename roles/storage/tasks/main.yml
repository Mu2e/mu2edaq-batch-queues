---
# Local LVM volumes (e.g. /scratch, /data-local) carved from free space in
# mc1_local_vg. Idempotent: an existing LV, filesystem or mount is left alone.
# Never shrinks, never reformats, never mounts over a non-empty directory.

- name: Free space in the volume group (MiB)
  ansible.builtin.command: vgs --noheadings --nosuffix --units m -o vg_free {{ mc1_local_vg }}
  register: st_vgfree
  changed_when: false
  check_mode: false
  environment:
    LVM_SUPPRESS_FD_WARNINGS: "1"

- name: Existing logical volumes in the volume group
  ansible.builtin.command: lvs --noheadings -o lv_name {{ mc1_local_vg }}
  register: st_lvs
  changed_when: false
  check_mode: false
  environment:
    LVM_SUPPRESS_FD_WARNINGS: "1"

- name: Work out which volumes are missing
  ansible.builtin.set_fact:
    st_missing: "{{ mc1_local_volumes | rejectattr('lv', 'in', st_lvs.stdout.split()) | list }}"

- name: Enough free space for the missing volumes
  ansible.builtin.assert:
    that: (st_vgfree.stdout | trim | float) >= (st_missing | map(attribute='size') | map('human_to_bytes') | sum / 1048576)
    fail_msg: >-
      {{ mc1_local_vg }} has {{ st_vgfree.stdout | trim }} MiB free; missing volumes
      {{ st_missing | map(attribute='lv') | list }} need
      {{ (st_missing | map(attribute='size') | map('human_to_bytes') | sum / 1048576) | int }} MiB
    quiet: true

- name: A mount point already in use must be mounted from our volume
  ansible.builtin.assert:
    that: >-
      (ansible_facts.mounts | selectattr('mount', 'equalto', item.mount) | map(attribute='device') | list)
      | difference(['/dev/mapper/' ~ mc1_local_vg ~ '-' ~ item.lv]) | length == 0
    fail_msg: "{{ item.mount }} is already mounted from another device; not touching it"
    quiet: true
  loop: "{{ mc1_local_volumes }}"
  loop_control:
    label: "{{ item.mount }}"

- name: Mount points that are not yet mounted
  ansible.builtin.find:
    paths: "{{ item.mount }}"
    hidden: true
    file_type: any
  loop: "{{ mc1_local_volumes }}"
  loop_control:
    label: "{{ item.mount }}"
  register: st_content
  when: item.mount not in (ansible_facts.mounts | map(attribute='mount') | list)

- name: Refuse to mount over a non-empty directory
  ansible.builtin.assert:
    that: item.skipped | default(false) or item.matched | default(0) == 0
    fail_msg: "{{ item.item.mount }} exists and is not empty; move its contents first"
    quiet: true
  loop: "{{ st_content.results }}"
  loop_control:
    label: "{{ item.item.mount }}"

- name: Create logical volumes
  ansible.builtin.command: lvcreate -y -n {{ item.lv }} -L {{ item.size }} {{ mc1_local_vg }}
  loop: "{{ st_missing }}"
  loop_control:
    label: "{{ mc1_local_vg }}/{{ item.lv }} {{ item.size }}"
  environment:
    LVM_SUPPRESS_FD_WARNINGS: "1"

- name: Existing filesystem type on each volume
  ansible.builtin.command: blkid -o value -s TYPE /dev/{{ mc1_local_vg }}/{{ item.lv }}
  loop: "{{ mc1_local_volumes }}"
  loop_control:
    label: "{{ item.lv }}"
  register: st_fstype
  changed_when: false
  failed_when: false
  check_mode: false

- name: Make filesystems on new volumes only
  ansible.builtin.command: mkfs.{{ item.item.fstype | default('xfs') }} -L {{ item.item.label }} /dev/{{ mc1_local_vg }}/{{ item.item.lv }}
  loop: "{{ st_fstype.results }}"
  loop_control:
    label: "{{ item.item.lv }}"
  when: item.stdout | trim == ''

- name: Mount and record in /etc/fstab
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "/dev/mapper/{{ mc1_local_vg }}-{{ item.lv }}"
    fstype: "{{ item.fstype | default('xfs') }}"
    opts: defaults,nofail
    state: mounted
  loop: "{{ mc1_local_volumes }}"
  loop_control:
    label: "{{ item.mount }}"
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ownership and mode of the mounted volumes
  ansible.builtin.file:
    path: "{{ item.mount }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ mc1_local_volumes }}"
  loop_control:
    label: "{{ item.mount }} {{ item.owner }}:{{ item.group }} {{ item.mode }}"
