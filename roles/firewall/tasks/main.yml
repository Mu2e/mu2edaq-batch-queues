---
# Open the Slurm ports to cluster members only, and only where firewalld runs.
#   controller : slurmctld port + srun port range (slurmstepd connects back to srun)
#   compute    : slurmd port (controller and peer slurmd tree fan-out)
# slurmdbd and MariaDB stay closed: both are used over loopback.

- name: Collect service states
  ansible.builtin.service_facts:

- name: Decide whether to manage the firewall
  ansible.builtin.set_fact:
    fw_active: >-
      {{ (mc1_manage_firewall | bool) and
         (ansible_facts.services['firewalld.service'] | default({})).get('state', 'absent') == 'running' }}

- name: Cluster member addresses
  ansible.builtin.set_fact:
    fw_sources: >-
      {{ mc1_cluster_addrs if mc1_cluster_addrs | length > 0 else
         (groups['slurm_cluster'] | map('extract', hostvars, ['ansible_facts', 'default_ipv4', 'address']) | list) }}
  when: fw_active | bool

- name: Ports this node must accept from cluster members
  ansible.builtin.set_fact:
    fw_ports: >-
      {{ [slurm_ports.slurmctld | string, slurm_srun_port_range]
         if inventory_hostname in groups['slurm_controller']
         else [slurm_ports.slurmd | string] }}
  when: fw_active | bool

- name: Default firewalld zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: fw_zone
  changed_when: false
  check_mode: false
  when: fw_active | bool

- name: Rich rules, one per (source, port)
  ansible.posix.firewalld:
    zone: "{{ fw_zone.stdout | trim }}"
    rich_rule: 'rule family="ipv4" source address="{{ item.0 }}" port port="{{ item.1 }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ fw_sources | product(fw_ports) | list }}"
  loop_control:
    label: "{{ item.0 }} -> {{ item.1 }}/tcp"
  when: fw_active | bool
