---
# Slurm traffic between cluster members goes to a zone this project owns.
#
# On the MC1 workers SCD's SLAM Puppet manages firewalld: worker addresses
# (131.225.0.0/16) match ipset fnal_ipv4 and land in zone 50_FNAL (target
# REJECT), whose zone files Puppet rewrites. Rules added there would be
# reverted, and rules in the default zone (99_public) never match.
#
# firewalld dispatches source-matched zones in name order, so the zone
# 10_mc1_cluster, with the cluster members' /32 addresses as sources,
# claims that traffic before 50_FNAL. Its target is mc1_fw_zone_target
# (ACCEPT since 2026-10-28, D28): the cluster is a trusted subnet, so all
# traffic between members passes (Slurm, NFS, ...). The explicit ssh/Slurm
# entries below stay for a non-ACCEPT target. Puppet does not manage this zone.
#
# Because this zone claims member traffic, Puppet's own openings (the
# firewalld policy FNAL, e.g. nfs_for_FNAL) never apply between members.

- name: Collect service states
  ansible.builtin.service_facts:

- name: Decide whether to manage the firewall
  ansible.builtin.set_fact:
    fw_active: >-
      {{ (mc1_manage_firewall | bool) and
         (ansible_facts.services['firewalld.service'] | default({})).get('state', 'absent') == 'running' }}

- name: Resolve cluster member addresses on the node
  ansible.builtin.command: getent ahostsv4 {{ item }}
  loop: "{{ groups['slurm_cluster'] }}"
  register: fw_resolved
  changed_when: false
  check_mode: false
  when: (fw_active | bool) and mc1_cluster_addrs | length == 0

- name: Cluster member addresses
  ansible.builtin.set_fact:
    fw_sources: >-
      {{ mc1_cluster_addrs if mc1_cluster_addrs | length > 0 else
         (fw_resolved.results | map(attribute='stdout_lines') | map('first') | map('split') | map('first') | unique | list) }}
  when: fw_active | bool

- name: Cluster zone exists (permanent)
  ansible.posix.firewalld:
    zone: "{{ mc1_fw_zone }}"
    state: present
    permanent: true
  register: fw_zone_created
  when: fw_active | bool

- name: Load the new zone into the running firewall
  ansible.builtin.command: firewall-cmd --reload
  when: (fw_active | bool) and fw_zone_created is changed and not ansible_check_mode

- name: Cluster members are the zone's sources
  ansible.posix.firewalld:
    zone: "{{ mc1_fw_zone }}"
    source: "{{ item }}/32"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ fw_sources | default([]) }}"
  when: fw_active | bool
  ignore_errors: "{{ ansible_check_mode }}"   # zone not loaded yet in a first --check

- name: Services open to cluster members
  ansible.posix.firewalld:
    zone: "{{ mc1_fw_zone }}"
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ mc1_fw_services }}"
  when: fw_active | bool
  ignore_errors: "{{ ansible_check_mode }}"

- name: Slurm ports open to cluster members
  ansible.posix.firewalld:
    zone: "{{ mc1_fw_zone }}"
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "{{ slurm_ports.slurmctld }}/tcp"
    - "{{ slurm_ports.slurmd }}/tcp"
    - "{{ slurm_srun_port_range }}/tcp"
  when: fw_active | bool
  ignore_errors: "{{ ansible_check_mode }}"

# Zone guard (D24). Site maintenance deleted the zone file on every node on
# 2026-10-16. mc1-fw-zone-guard keeps a copy outside /etc/firewalld and puts
# it back, at boot before the Slurm daemons, whenever firewalld starts, and
# every mc1_fw_guard_interval. The copy is taken from the live file, so it
# follows later edits to the zone (the nfs role, for one).
- name: Zone guard store
  ansible.builtin.file:
    path: "{{ mc1_fw_guard_store }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: (fw_active | bool) and (mc1_fw_guard_enabled | bool)

- name: Zone guard script
  ansible.builtin.copy:
    src: mc1-fw-zone-guard
    dest: /usr/local/sbin/mc1-fw-zone-guard
    owner: root
    group: root
    mode: "0755"
  when: (fw_active | bool) and (mc1_fw_guard_enabled | bool)

- name: Zone guard settings
  ansible.builtin.template:
    src: mc1-fw-zone-guard.sysconfig.j2
    dest: /etc/sysconfig/mc1-fw-zone-guard
    owner: root
    group: root
    mode: "0644"
  when: (fw_active | bool) and (mc1_fw_guard_enabled | bool)

- name: Zone guard units
  ansible.builtin.template:
    src: "mc1-fw-zone-guard.{{ item }}.j2"
    dest: "/etc/systemd/system/mc1-fw-zone-guard.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  notify: Reload systemd units
  when: (fw_active | bool) and (mc1_fw_guard_enabled | bool)

- name: Load the zone guard units
  ansible.builtin.meta: flush_handlers

- name: Zone target {{ mc1_fw_zone_target }} (trusted cluster subnet, D28)
  ansible.posix.firewalld:
    zone: "{{ mc1_fw_zone }}"
    target: "{{ mc1_fw_zone_target }}"
    state: present
    permanent: true
  register: fw_target
  when: fw_active | bool
  ignore_errors: "{{ ansible_check_mode }}"

# A target change is permanent-only; reload to apply it. Established
# connections (NFS mounts, srun) survive a reload.
- name: Apply the zone target
  ansible.builtin.command: firewall-cmd --reload
  when: (fw_active | bool) and fw_target is changed and not ansible_check_mode

- name: Save the zone now (first copy, or refresh after the changes above)
  ansible.builtin.command: /usr/local/sbin/mc1-fw-zone-guard -z {{ mc1_fw_zone }} -s {{ mc1_fw_guard_store }} sync
  register: fw_guard_sync
  changed_when: fw_guard_sync.stdout is search('saved|restored|reloaded')
  when: (fw_active | bool) and (mc1_fw_guard_enabled | bool) and not ansible_check_mode

- name: Zone guard enabled (service at boot and on firewalld start; timer)
  ansible.builtin.systemd:
    name: "mc1-fw-zone-guard.{{ item.unit }}"
    enabled: true
    state: "{{ item.state | default(omit) }}"
  loop:
    - {unit: service}
    - {unit: timer, state: started}
  when: (fw_active | bool) and (mc1_fw_guard_enabled | bool)
  ignore_errors: "{{ ansible_check_mode }}"   # units not installed yet in --check
