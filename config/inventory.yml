# MC1 Slurm inventory.
#
# slurm_controller : slurmctld + slurmdbd + MariaDB + job submission (no slurmd)
# slurm_compute    : slurmd
#
# All 18 workers are online (2026-10-07): 01 is the controller, 02-18 compute.
# Workers that are not yet online can be declared to Slurm as State=FUTURE
# through slurm_future_nodelist (group_vars/all.yml) instead of listed here.
all:
  vars:
    ansible_user: "{{ mc1_ssh_user }}"
    ansible_ssh_common_args: "-o ProxyJump={{ mc1_jump }}"
  children:
    # Every MC1 worker, for host-level roles such as storage. All 18 answered
    # on 2026-10-07. Slurm membership is the separate slurm_cluster group.
    mc1_workers:
      hosts:
        mu2e-mc1-worker-[01:18].fnal.gov:
    slurm_cluster:
      children:
        slurm_controller:
          hosts:
            mu2e-mc1-worker-01.fnal.gov:
        slurm_compute:
          hosts:
            mu2e-mc1-worker-[02:18].fnal.gov:
