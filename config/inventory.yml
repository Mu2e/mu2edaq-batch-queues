# MC1 Slurm inventory.
#
# slurm_controller : slurmctld + slurmdbd + MariaDB + job submission (no slurmd)
# slurm_compute    : slurmd
#
# Workers that are not yet online are NOT listed here. They are declared to
# Slurm as State=FUTURE through slurm_future_nodelist (group_vars/all.yml).
# To bring one online: add it under slurm_compute, shrink
# slurm_future_nodelist, and re-run the deploy.
all:
  vars:
    ansible_user: "{{ mc1_ssh_user }}"
    ansible_ssh_common_args: "-o ProxyJump={{ mc1_jump }}"
  children:
    # Every MC1 worker, for host-level roles such as storage. All 18 answered
    # on 2026-10-07. Slurm membership is the separate slurm_cluster group.
    mc1_workers:
      hosts:
        mu2e-mc1-worker-[01:18].fnal.gov:
    slurm_cluster:
      children:
        slurm_controller:
          hosts:
            mu2e-mc1-worker-01.fnal.gov:
        slurm_compute:
          hosts:
            mu2e-mc1-worker-02.fnal.gov:
            mu2e-mc1-worker-03.fnal.gov:
