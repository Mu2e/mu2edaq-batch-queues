# Main configuration for the MC1 Slurm deployment.
#
# Override order (highest wins): command line (mc1-slurm-deploy --set / options)
# > environment (MC1_*) > .env > this file. The wrapper passes overrides to
# ansible-playbook as extra vars, which outrank everything here.
#
# Secrets do not belong in this file: the munge key and the slurmdbd database
# password are generated on the controller and never leave the cluster.

# ---------------------------------------------------------------- access ----
mc1_jump: mu2eshift@g2gateway01.fnal.gov   # ProxyJump hop into the enclave
mc1_ssh_user: root                          # login on the workers
mc1_dnf_disablerepo:                        # repos skipped by every dnf call
  - libnvidia-container                     # metadata GPG check fails (2026-10-06)

# ------------------------------------------------------------- preflight ----
mc1_puppet_policy: warn        # fail | warn when a Puppet/OpenVox agent is active
                               # warn: SLAM Puppet runs everywhere but manages only root,
                               # its own packages/services and firewalld (user, 2026-10-07)
mc1_max_clock_offset_s: 1.0    # chrony offset limit; munge rejects skew > ~5 min

# -------------------------------------------------------------- accounts ----
# Service accounts: identical UID/GID on every node, created BEFORE the
# packages so the RPM scriptlets reuse them instead of allocating dynamic IDs.
# PROPOSED values: preflight fails if any is taken by a different name.
mc1_service_accounts:
  - name: munge
    uid: 450
    gid: 450
    home: /var/lib/munge
    comment: MUNGE authentication service
  - name: slurm
    uid: 451
    gid: 451
    home: /var/lib/slurm
    comment: Slurm workload manager

# Job accounts. Existing accounts are not created; their home ownership is
# repaired when fix_home_ownership is true (worker homes were root:root 750
# on 2026-10-02). New accounts need a uid chosen outside every range the
# nodes could later receive from SSSD/LDAP; preflight refuses a null uid.
mc1_job_accounts:
  - name: mu2ebatch
    create: true
    uid: 51329                # user's choice 2026-10-06; free on workers 01-03
    group: mu2e
    gid: 9914                 # preflight asserts group mu2e has this gid
    home: /home/mu2ebatch
    comment: Mu2e MC1 batch service account
    # .k5login = union of these accounts' .k5login on the same node, plus
    # any principals listed in k5login. Read at deploy time, never stored here.
    k5login_from: [mu2eshift, mu2edaq]
    k5login: []
    # Login environment set up the way mu2eshift/mu2edaq are: a copy of the
    # reference account's daq-shifter-tools checkout (same commit), then its
    # install-login.sh run as this account (dotfiles, ~/bin, ~/.mu2edaq/env),
    # plus the files below copied from the reference account.
    login_env_from: mu2eshift
    login_files_copy: [.gitconfig, .ssh/config]
  - name: mu2eshift
    create: false
    fix_home_ownership: true
  - name: mu2edaq
    create: false
    fix_home_ownership: true

# ----------------------------------------------------------------- slurm ----
slurm_controller_fqdn: "{{ groups['slurm_controller'][0] }}"   # derived; edit the inventory instead
slurm_cluster_name: mc1
# One Slurm release on every node, built from SchedMD source as RPMs for EL9
# and EL10 (scripts/mc1-slurm-build-rpms) because EPEL ships 22.05 on EL9
# and 26.05 on EL10, and slurmd may never be newer than slurmctld.
slurm_version: "26.05.4"
slurm_rpm_dir: "{{ playbook_dir }}/../artifacts/rpms/{{ slurm_version }}"   # el9/, el10/ (git-ignored)
slurm_packages_controller: [slurm, slurm-slurmctld, slurm-slurmdbd]
slurm_packages_compute: [slurm, slurm-slurmd]
slurm_ports:
  slurmctld: 6817
  slurmd: 6818
  slurmdbd: 6819
slurm_srun_port_range: "60001-63000"   # srun on the submit node listens here
slurm_state_save: /var/spool/slurm/ctld
slurm_spool_dir: /var/spool/slurm/d
slurm_log_dir: /var/log/slurm
slurm_debug: info

slurm_account: mu2e                    # sacctmgr account holding the job users
slurm_accounting_enforce: associations,limits
slurm_def_mem_per_cpu: 2000            # MB, when a job asks for no memory
slurm_node_mem_reserve_mb: 2048        # kept back from RealMemory for the OS

# Workers declared to Slurm but not yet online (Slurm hostlist syntax);
# empty = none. All 18 workers are in the inventory since 2026-10-07.
slurm_future_nodelist: ""
# Hardware for FUTURE nodes; empty means "same as the first compute node".
slurm_future_node_spec: {}

# Per-host hardware overrides go in host_vars/<fqdn>.yml as slurm_node_spec,
# e.g. {sockets: 2, cores_per_socket: 16, threads_per_core: 2, real_memory: 190000}.

slurm_partitions:
  - name: mc1
    default: true
    max_time: INFINITE
    # nodes: omitted means every compute node plus the FUTURE nodes

# --------------------------------------------------------------- slurmdbd ---
slurmdbd_storage_loc: slurm_acct_db
slurmdbd_password_file: /etc/slurm/.slurmdbd-db.pw   # generated on the controller
slurmdbd_innodb_buffer_pool_size: 1G
slurmdbd_purge:
  PurgeEventAfter: 12months
  PurgeJobAfter: 24months
  PurgeResvAfter: 12months
  PurgeStepAfter: 6months
  PurgeSuspendAfter: 12months
  PurgeTXNAfter: 12months
  PurgeUsageAfter: 24months

# ---------------------------------------------------------------- storage ---
# Local volumes carved from free space in mc1_local_vg (os_vg had 710.85 GiB
# free on workers 01-03, 2026-10-07). Sizes use LVM units (G = GiB).
mc1_local_vg: os_vg
mc1_local_volumes:
  - {lv: scratch,    mount: /scratch,    size: 100G, label: scratch,    owner: root, group: mu2e, mode: "1777"}
  - {lv: data_local, mount: /data-local, size: 500G, label: data-local, owner: root, group: mu2e, mode: "1777"}

# -------------------------------------------------------------------- nfs ---
# /nfshome (worker-17) and /nfsdata (worker-18) exported to every MC1 worker
# and mounted at the same path everywhere. Gated twice: mc1_nfs_enabled must
# be true AND SLAM Puppet must no longer pin nfs-server to "stopped" (it does
# on 2026-10-08, class nfs::service), unless mc1_nfs_ignore_puppet is set.
mc1_nfs_enabled: false
mc1_nfs_ignore_puppet: false
mc1_nfs_exports:
  - {server: mu2e-mc1-worker-17.fnal.gov, path: /nfshome, mount: /nfshome}
  - {server: mu2e-mc1-worker-18.fnal.gov, path: /nfsdata, mount: /nfsdata}
mc1_nfs_export_options: rw,sync,root_squash,no_subtree_check,sec=sys
mc1_nfs_mount_options: rw,hard,nfsvers=4.2,proto=tcp,_netdev,nofail,x-systemd.automount,x-systemd.mount-timeout=30
# Top-level layout on the servers. /nfshome gets one 0750 directory per job
# account; /nfsdata is group-writable for mu2e with setgid.
mc1_nfs_layout:
  /nfshome: {owner: root, group: root, mode: "0755", per_account: true}
  /nfsdata: {owner: root, group: mu2e, mode: "2775", per_account: false}

# ------------------------------------------------------------------ cvmfs ---
# CernVM-FS client on every MC1 worker, repositories mounted statically at
# /cvmfs/<repo> from /etc/fstab (no autofs). RPMs come from the local bundle
# fetched by scripts/mc1-cvmfs-fetch-rpms, like Slurm.
mc1_cvmfs_enabled: true
mc1_cvmfs_ignore_puppet: false        # refuse if the Puppet catalog manages cvmfs
mc1_cvmfs_version: "2.14.1"
mc1_cvmfs_rpm_dir: "{{ playbook_dir }}/../artifacts/rpms/cvmfs/{{ mc1_cvmfs_version }}"
mc1_cvmfs_packages: [cvmfs, cvmfs-libs, cvmfs-fuse3, cvmfs-config-default]
# Mu2e's setup scripts pull products from fermilab.opensciencegrid.org too.
mc1_cvmfs_repositories:
  - mu2e.opensciencegrid.org
  - fermilab.opensciencegrid.org
# Empty: CVMFS_CLIENT_PROFILE=single, i.e. proxy discovery via the WLCG WPAD
# (cernvm-wpad.fnal.gov), which returns the Fermilab squids for on-site
# addresses. Set an explicit list ("http://squid1:3128|http://squid2:3128;DIRECT")
# to pin the proxies.
mc1_cvmfs_http_proxy: ""
# Empty: use only the configuration packaged in cvmfs-config-default and do
# not mount cvmfs-config.cern.ch (static mounts would need it mounted first).
mc1_cvmfs_config_repository: ""
mc1_cvmfs_cache_base: /var/lib/cvmfs
mc1_cvmfs_quota_mb: 20000             # CVMFS_QUOTA_LIMIT; needs ~15% headroom on the cache filesystem
mc1_cvmfs_mount_options: defaults,_netdev,nodev,nofail
# Stratum 1 used by the reachability check (and nothing else).
mc1_cvmfs_check_url: http://cvmfs-s1fnal.opensciencegrid.org:8000/cvmfs

# --------------------------------------------------------------- firewall ---
# Applied only where firewalld is active: an own zone whose sources are the
# slurm_cluster members' addresses (see roles/firewall). Nothing outside the
# cluster is opened.
mc1_manage_firewall: true
mc1_fw_zone: 10_mc1_cluster    # sorts before Puppet's 50_FNAL
mc1_fw_services: [ssh]         # members' traffic leaves 50_FNAL, so keep ssh
mc1_cluster_addrs: []          # empty = resolve slurm_cluster hosts on each node
