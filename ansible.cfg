[defaults]
inventory = config/inventory.yml
roles_path = roles
collections_path = collections
retry_files_enabled = False
callback_result_format = yaml
forks = 10
interpreter_python = /usr/bin/python3
host_key_checking = True
# Mark rendered files so nobody hand-edits them on the nodes.
ansible_managed = Managed by mu2edaq-batch-queues (Ansible). Local edits are overwritten.

[ssh_connection]
pipelining = True
# GSSAPI (Kerberos) authentication; the ProxyJump hop comes from the inventory
# (ansible_ssh_common_args), built from mc1_jump.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o GSSAPIAuthentication=yes -o BatchMode=yes
